[package]
name = "want-pass-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.54.1", default-features = false, features = ["macros", "net", "rt"] }

[dev-dependencies]
tower = { version = "0.5.3", default-features = false, features = ["util"] }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
