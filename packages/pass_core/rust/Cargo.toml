[package]
name = "want-pass-vault"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
argon2 = { version = "=0.6.0", features = ["zeroize"] }
bip39 = { version = "=3.0.0", features = ["zeroize"] }
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
flutter_rust_bridge = "=2.13.0"
getrandom = "=0.4.3"
hkdf = "=0.13.0"
libc = "0.2"
sha2 = "=0.11.1"
tempfile = "=3.27.0"
unicode-general-category = "=1.1.0"
zeroize = { version = "=1.9.1", features = ["derive"] }

[lints.rust]
unsafe_code = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }

[lints.clippy]
all = "warn"
