[package]
name = "want-pass-vault"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
argon2 = { version = "=0.6.0", features = ["zeroize"] }
base64 = "=0.22.1"
bip39 = { version = "=3.0.0", features = ["zeroize"] }
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
flutter_rust_bridge = "=2.13.0"
getrandom = "=0.4.3"
hkdf = "=0.13.0"
libc = "0.2"
pgp = { version = "=0.21.0", default-features = false }
pkcs8 = { version = "=0.11.0", features = ["pkcs5", "pem"] }
rsa = "=0.9.10"
serde = { version = "=1.0.229", features = ["derive"] }
serde-saphyr = "=2.0.0"
serde_json = "=1.0.154"
sha2 = "=0.11.1"
ssh-key = "=0.6.7"
tempfile = "=3.27.0"
totp-rs = { version = "=6.0.0", default-features = false, features = ["std", "otpauth", "zeroize"] }
unicode-general-category = "=1.1.0"
url = "=2.5.8"
x509-cert = "=0.3.0"
zeroize = { version = "=1.9.1", features = ["derive"] }

ed25519-dalek = { version = "=2.2.0", features = ["pkcs8", "pem"] }
p256 = { version = "=0.13.2", features = ["pem", "pkcs8"] }
p384 = { version = "=0.13.1", features = ["pem", "pkcs8"] }
p521 = { version = "=0.13.3", features = ["pem", "pkcs8"] }


[lints.rust]
unsafe_code = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }

[lints.clippy]
all = "warn"

[dev-dependencies]
rand = "=0.8.8"
