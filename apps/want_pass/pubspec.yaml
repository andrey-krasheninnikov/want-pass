name: want_pass
description: Want Pass desktop and mobile client.
version: 0.1.0+1
publish_to: none
resolution: workspace
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bloc: ^9.0.0
  bloc_effects: ^2.1.0
  domain_error: 5.0.3
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  injectable: ^3.0.0
  launch_mode: 0.2.0
  path_provider: 2.1.6
  talker: ^5.1.20
  talker_bloc_effects: 0.1.0
  want_allure: 1.1.1
  forui: 0.27.7
  file_selector: 1.1.0
  qr_flutter: 4.1.0
  want_pass_core: ^0.1.0
dev_dependencies:
  flutter_launcher_icons: 0.14.4
  integration_test:
    sdk: flutter
  build: ^4.0.11
  dart_style: ^3.1.14
  source_gen: ^4.2.4
  build_runner: 2.16.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator: ^3.1.3
flutter:
  uses-material-design: true
  assets:
    - assets/brand/

flutter_launcher_icons:
  image_path: assets/brand/app-icon.png
  macos:
    generate: true
    image_path: assets/brand/app-icon.png
